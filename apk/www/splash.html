<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Climate Line</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }

    .splash {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      position: relative;
      background: linear-gradient(135deg, #ffffff 0%, #e8f5e9 25%, #c8e6c9 50%, #a5d6a7 75%, #ffffff 100%);
      background-size: 400% 400%;
      animation: gradientShift 6s ease infinite;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Floating circles */
    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(81, 191, 113, 0.08);
      animation: float 8s ease-in-out infinite;
    }
    .circle:nth-child(1) { width: 180px; height: 180px; top: 10%; left: 5%; animation-delay: 0s; }
    .circle:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 10%; animation-delay: -2s; }
    .circle:nth-child(3) { width: 240px; height: 240px; bottom: 5%; left: 20%; animation-delay: -4s; }
    .circle:nth-child(4) { width: 80px; height: 80px; top: 30%; right: 30%; animation-delay: -1s; }
    .circle:nth-child(5) { width: 160px; height: 160px; bottom: 30%; right: 5%; animation-delay: -3s; }
    .circle:nth-child(6) { width: 100px; height: 100px; top: 5%; right: 15%; animation-delay: -5s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
      50% { transform: translateY(-30px) scale(1.05); opacity: 1; }
    }

    .content {
      text-align: center;
      z-index: 1;
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      color: #1b5e20;
      letter-spacing: -0.5px;
    }
    .brand .normal { font-weight: 400; color: #388e3c; }
    .brand .bold { font-weight: 800; color: #1b5e20; }

    .tagline {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.75rem;
      color: #66bb6a;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    .loader {
      margin-top: 40px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .loader span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
      animation: bounce 1.4s ease-in-out infinite;
    }
    .loader span:nth-child(2) { animation-delay: -1.1s; }
    .loader span:nth-child(3) { animation-delay: -0.9s; }
    .loader span:nth-child(4) { animation-delay: -0.7s; }
    .loader span:nth-child(5) { animation-delay: -0.5s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.5); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="content">
      <div class="brand">
        <span class="normal">THE</span> <span class="bold">CLIMATELINE</span>
      </div>
      <div class="tagline">real-time climate tracker</div>

      <div class="loader">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script>
    setTimeout(function () {
      try { sessionStorage.setItem('fromSplash', '1'); } catch(e) {}
      window.location.replace('index.html');
    }, 3000);
  </script>
</body>
</html>
