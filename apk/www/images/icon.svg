<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Rounded box background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="4" y="4" width="504" height="504" rx="92" ry="92" fill="none" stroke="#a5d6a7" stroke-width="3"/>

  <!-- C° centered -->
  <g transform="translate(230, 260)">
    <text x="0" y="0" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="280" font-weight="800" fill="#2e7d32">C</text>
    <text x="120" y="-80" dominant-baseline="central" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="300" fill="#43a047">°</text>
  </g>
</svg>
