<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Listen to climate audio briefings from The Climate Line. Stay informed with daily updates on climate science, extreme weather, and the solutions shaping our future.">
  <meta property="og:title" content="Listen — The Climate Line Audio Briefings">
  <meta property="og:description" content="Listen to climate audio briefings from The Climate Line. Stay informed with daily updates on climate science, extreme weather, and the solutions shaping our future.">
  <meta property="og:image" content="https://theclimateline.pages.dev/media/hero/hero-1.png">
  <meta property="og:url" content="https://theclimateline.pages.dev/listen.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Climate Line">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Listen — The Climate Line Audio Briefings">
  <meta name="twitter:description" content="Listen to climate audio briefings from The Climate Line. Stay informed with daily updates on climate science, extreme weather, and the solutions shaping our future.">
  <meta name="twitter:image" content="https://theclimateline.pages.dev/media/hero/hero-1.png">
  <title>Listen — The Climate Line Audio Briefings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <div class="nav-inner">
      <a href="/" class="nav-logo">TheClimateLine</a>
      <div class="nav-right">
        <a href="/">Home</a>
        <a href="https://www.youtube.com/@theclimateline" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
  </nav>

  <section class="listen-hero">
    <div class="listen-hero-img"></div>
    <div class="listen-hero-overlay">
      <h1>Listen</h1>
      <p>Daily climate audio briefings</p>
    </div>
  </section>

  <section class="section listen-section">
    <div class="section-inner">
      <div class="listen-list" id="listenList"></div>
    </div>
  </section>

  <div class="listen-player" id="listenPlayer">
    <div class="listen-player-inner">
      <button class="lp-btn" id="lpPrev" aria-label="Previous">&#9664;</button>
      <button class="lp-btn lp-play-btn" id="lpPlay" aria-label="Play">&#9654;</button>
      <button class="lp-btn" id="lpNext" aria-label="Next">&#9654;&#9654;</button>
      <span class="lp-title" id="lpTitle">No track selected</span>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <div class="footer-col">
        <h4>TheClimateLine</h4>
        <p>Making climate science accessible, one story at a time.</p>
      </div>
      <div class="footer-col">
        <h4>Explore</h4>
        <a href="/">Home</a>
        <a href="/">Articles</a>
      </div>
      <div class="footer-col">
        <h4>Connect</h4>
        <a href="https://www.youtube.com/@theclimateline" target="_blank" rel="noopener">YouTube</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 The Climate Line</span>
    </div>
  </footer>

  <script src="js/articles.js"></script>
  <script src="js/listen.js"></script>
</body>
</html>
